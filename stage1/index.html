<!doctype html>
<meta charset="utf-8">
<title>모모 vs 루루 1단계</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; --bg: #2b1d2a; --panel: #3a2838; --text: #f6e9f1; --muted: #c9aabd; --accent: #ff8fb3; --key: #5a3f55; }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--text); }
  body { margin: 0; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  main { max-width: 992px; margin: 0 auto; padding: 16px; }
  canvas { display: block; max-width: 100%; aspect-ratio: 16 / 9; image-rendering: pixelated; border-radius: 8px; background: #000; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-top: 14px; }
  section { background: var(--panel); border-radius: 8px; padding: 12px 14px; font-size: 14px; line-height: 1.8; }
  h2 { margin: 0 0 6px; font-size: 15px; color: var(--accent); }
  kbd { display: inline-block; min-width: 22px; padding: 0 6px; border-radius: 4px; background: var(--key); text-align: center; font-family: inherit; font-size: 13px; }
  .muted { color: var(--muted); font-size: 13px; }
</style>
<main>
  <canvas id="screen"></canvas>
  <div class="grid">
    <section><h2>1P 모모 (분홍)</h2>
      이동 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><br>
      약P <kbd>F</kbd> 강P <kbd>G</kbd> 약K <kbd>V</kbd> 강K <kbd>B</kbd></section>
    <section><h2>2P 루루 (하늘색)</h2>
      이동 <kbd>방향키</kbd><br>
      약P <kbd>K</kbd> 강P <kbd>L</kbd> 약K <kbd>,</kbd> 강K <kbd>.</kbd> <span class="muted">(숫자패드 4·5·1·2도 됨)</span></section>
    <section><h2>기본 규칙</h2>
      위 = 점프, 아래 = 앉기, <b>상대 반대쪽</b>을 누르면 가드<br>
      앉아 킥은 <b>하단</b>(앉아서 막기), 점프 공격은 <b>중단</b>(서서 막기)<br>
      약공격이 맞거나 막히면 강공격으로 이어 쓸 수 있음<br>
      <span class="muted">3판 2선승 · 60초 · <kbd>H</kbd> 판정 박스 보기</span></section>
  </div>
</main>
